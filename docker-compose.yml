# Scientia: self-hosted Supabase (Postgres, GoTrue, PostgREST, Storage) + web app.
# `docker compose up` and open http://localhost:3000. Override defaults in .env (see .env.example).
name: scientia

x-secrets: &secrets
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scientia-local-db-password}
  JWT_SECRET: ${JWT_SECRET:-scientia-local-development-jwt-secret-change-me}
  ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkxNTA0MDAwLCJleHAiOjIxMDY4NjQwMDB9.2NBkUj6pIlehmICc3ObpZY916qsoIzqcG17aKxiMS8o}
  SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTE1MDQwMDAsImV4cCI6MjEwNjg2NDAwMH0.s0rb0ojBrHRW8_8NpndT3SYhtCuLRit_WIAzuflYCeg}

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scientia-local-db-password}
      JWT_SECRET: ${JWT_SECRET:-scientia-local-development-jwt-secret-change-me}
      JWT_EXP: 3600
    volumes:
      - ./supabase/init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      # Local only: lets `bun run supabase/reset.ts` (e2e) reach the database.
      - "127.0.0.1:${DB_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 40

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${WEB_PORT:-3000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-scientia-local-db-password}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${WEB_PORT:-3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "true" # accounts are created by administrators
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-scientia-local-development-jwt-secret-change-me}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 5s
      retries: 40

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-scientia-local-db-password}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-scientia-local-development-jwt-secret-change-me}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-scientia-local-development-jwt-secret-change-me}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  storage:
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkxNTA0MDAwLCJleHAiOjIxMDY4NjQwMDB9.2NBkUj6pIlehmICc3ObpZY916qsoIzqcG17aKxiMS8o}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTE1MDQwMDAsImV4cCI6MjEwNjg2NDAwMH0.s0rb0ojBrHRW8_8NpndT3SYhtCuLRit_WIAzuflYCeg}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:-scientia-local-development-jwt-secret-change-me}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-scientia-local-db-password}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 3s
      timeout: 5s
      retries: 40

  # One-shot: applies supabase/migrations/*.sql in order, then seeds demo data.
  migrate:
    build: .
    command: ["bun", "run", "supabase/migrate.ts"]
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      <<: *secrets
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-scientia-local-db-password}@db:5432/postgres
      AUTH_URL: http://auth:9999
      STORAGE_URL: http://storage:5000
      SEED_DEMO: ${SEED_DEMO:-true}

  web:
    build: .
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkxNTA0MDAwLCJleHAiOjIxMDY4NjQwMDB9.2NBkUj6pIlehmICc3ObpZY916qsoIzqcG17aKxiMS8o}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTE1MDQwMDAsImV4cCI6MjEwNjg2NDAwMH0.s0rb0ojBrHRW8_8NpndT3SYhtCuLRit_WIAzuflYCeg}
      AUTH_URL: http://auth:9999
      REST_URL: http://rest:3000
      STORAGE_URL: http://storage:5000
      PORT: 3000
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  db-data:
  storage-data:
